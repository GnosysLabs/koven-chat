# Koven — production compose stack.
#
# What's here:
#   caddy      — TLS terminator + reverse proxy + static SPA host
#   synapse    — Matrix homeserver (client API only — no federation)
#   postgres   — Synapse's database
#   engine     — Koven's governance / admin / profile service
#
# Voice/video calls are NOT handled by a self-hosted TURN server —
# they go through Cloudflare RealtimeKit (engine/src/calls.ts), which
# includes TURN infrastructure as part of the service.  An earlier
# coturn container was removed in 2026-05 once the legacy MatrixCall
# path retired.
#
# All variables come from .env at the repo root.  `bin/koven setup`
# fills any blank ones with cryptographically-random secrets.  Run
# that once before `docker compose up`.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"     # ACME HTTP-01 challenge + redirect-to-HTTPS
      - "443:443"   # The actual app
    volumes:
      # Caddyfile.runtime is rendered by `bin/koven setup` from
      # Caddyfile.template — keeps the repo clean across re-runs.
      - ./Caddyfile.runtime:/etc/caddy/Caddyfile:ro
      - ./client/dist:/srv/client:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      KOVEN_HOSTNAME: ${KOVEN_HOSTNAME}
      SERVER_NAME: ${SERVER_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    depends_on:
      - synapse
      - engine

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      # Synapse needs the UTF8/C locale combo specifically — its
      # collations break with anything else.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 5s
      timeout: 5s
      retries: 10

  synapse:
    build:
      context: ./docker/synapse
      dockerfile: Dockerfile
    image: koven/synapse:latest
    restart: unless-stopped
    volumes:
      - ./synapse-data:/data
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    depends_on:
      postgres:
        condition: service_healthy
    # No ports: declared — Caddy is the public face and only proxies
    # the /_matrix/client/* + /_synapse/admin/* paths.  Federation
    # is off entirely (homeserver.yaml drops the federation listener
    # name + sets federation_domain_whitelist: []), so there's no
    # 8448 to expose either.

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    image: koven/engine:latest
    restart: unless-stopped
    volumes:
      - ./data/engine:/data
      # The engine reads the appservice token out of the same YAML
      # Synapse loads, so we mount the synapse-data dir read-only.
      - ./synapse-data:/synapse-data:ro
      # Per-bot scratch dirs for stdio MCP servers.  Each bot gets
      # /var/lib/koven-mcp/<bot_id>/ inside the container, bind-
      # mounted as /home/sandbox into the bwrap-isolated subprocess.
      # Persisting on the host means npm/uv caches survive container
      # rebuilds — bots stay fast across deploys.
      - ./data/koven-mcp:/var/lib/koven-mcp
    cap_add:
      # bwrap needs SYS_ADMIN to set up the user namespace it uses
      # for the subprocess sandbox.  Without it, bwrap falls back to
      # unprivileged-user-namespace mode which Debian disables by
      # default in containers, and the subprocess fails to spawn.
      # Scope is contained: only the engine container needs it; the
      # MCP subprocess inside the sandbox does NOT inherit caps.
      - SYS_ADMIN
    security_opt:
      # Docker's default AppArmor + seccomp profiles block syscalls
      # bwrap needs to set up its mount namespace, even with
      # CAP_SYS_ADMIN.  Two errors we hit in sequence:
      #   apparmor blocks mount() → "Failed to make / slave"
      #   seccomp blocks pivot_root() → "Operation not permitted"
      # Both unconfined-ed.  Trust boundary unchanged: bwrap drops
      # all capabilities + sets a fresh, restrictive view for the
      # inner subprocess via --unshare-user-try, so the MCP package
      # the user attached runs WITHOUT mount/pivot_root powers.  The
      # relaxation only applies to the engine process itself, which
      # is already root-in-container and runs only our trusted code.
      - apparmor:unconfined
      - seccomp:unconfined
    environment:
      HOMESERVER_URL: http://synapse:8008
      HOMESERVER_NAME: ${SERVER_NAME}
      ENGINE_REGISTRATION: /synapse-data/koven-engine.appservice.yaml
      ENGINE_DB: /data/engine.sqlite
      ENGINE_PORT: "9000"
      # Email-code auth.  Operator picks one transport; the empty one
      # is a no-op.  See .env.example for the full set.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_FROM: ${EMAIL_FROM:-Koven <noreply@koven.chat>}
      EMAIL_CODE_TTL_MS: ${EMAIL_CODE_TTL_MS:-600000}
      # Real admin user token, used by /api/auth/* to admin-create
      # accounts and mint per-session login tokens.  Provisioned by
      # `bin/koven bootstrap-admin` on first install.
      SYNAPSE_ADMIN_TOKEN: ${SYNAPSE_ADMIN_TOKEN:-}
      # Username + password for the same admin user.  Used by the
      # engine's adminFetch self-heal: when Synapse rejects the token
      # with M_UNKNOWN_TOKEN (rotated, revoked, or DB reset), the
      # engine re-logs-in with these and retries.  Without them a
      # stale SYNAPSE_ADMIN_TOKEN blocks every login until an operator
      # manually re-runs bootstrap-admin.
      SYNAPSE_ADMIN_USER:     ${SYNAPSE_ADMIN_USER:-}
      SYNAPSE_ADMIN_PASSWORD: ${SYNAPSE_ADMIN_PASSWORD:-}
      # Bot platform: AES-GCM key for per-bot secret encryption +
      # the per-user bot count cap.  Both auto-generated / defaulted
      # by `bin/koven setup`.
      BOT_KEY_ENCRYPTION_SECRET: ${BOT_KEY_ENCRYPTION_SECRET:-}
      MAX_BOTS_PER_USER: ${MAX_BOTS_PER_USER:-30}
      # Cloudflare RealtimeKit (per-room voice/video calls).  When
      # unset, the Join Voice button is hidden and /api/calls/*
      # returns 503.  PUBLIC_ENGINE_URL is the externally-reachable
      # base URL for this engine — used by the boot-time webhook
      # self-registration so RealtimeKit knows where to fire
      # participant join/leave events.
      CF_REALTIME_ACCOUNT_ID:    ${CF_REALTIME_ACCOUNT_ID:-}
      CF_REALTIME_APP_ID:        ${CF_REALTIME_APP_ID:-}
      CF_REALTIME_TOKEN:         ${CF_REALTIME_TOKEN:-}
      CF_REALTIME_WEBHOOK_SECRET: ${CF_REALTIME_WEBHOOK_SECRET:-}
      CF_REALTIME_PRESET:        ${CF_REALTIME_PRESET:-group_call_participant}
      PUBLIC_ENGINE_URL:         ${PUBLIC_ENGINE_URL:-}
    depends_on:
      - synapse

  # NOTE: coturn was removed in 2026-05 — all WebRTC voice/video
  # traffic goes through Cloudflare RealtimeKit (see engine/src/calls.ts),
  # which has its own TURN infrastructure baked in.  The legacy Matrix
  # native MatrixCall path that used to depend on a self-hosted coturn
  # was retired alongside the move to RealtimeKit, leaving no caller of
  # /voip/turnServer.  Removing coturn also clears one fewer thing
  # that needs a public-IP-bound port on the box once Cloudflare's
  # orange-cloud proxy is enabled in front of client.koven.chat.

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

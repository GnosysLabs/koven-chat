# Cross-platform release pipeline for the Koven desktop shell.
#
# Triggered by pushing a `desktop-v*` tag.  Branch pushes that touch
# apps/desktop/ run the same matrix as a sanity build but skip the
# release upload.  Each runner builds one platform, signs the
# artifact with the minisign keypair (used by Tauri's updater), and
# uploads to a draft GitHub Release.  A final "publish" job promotes
# the draft to public.
#
# Mac:     Apple Silicon only.  Output is the `.app` bundle and its
#          `.app.tar.gz` updater artifact (Sparkle-style zip flow —
#          no .dmg).  Code-signed + notarized by tauri-action when
#          the Apple secrets are set; falls through unsigned otherwise.
# Linux:   x86_64 .AppImage + .deb (WebKitGTK).
# Windows: x86_64 NSIS installer (WebView2).
#
# Versioning is independent from the web client + engine.  The tag
# IS the version: `desktop-v0.1.0` → version 0.1.0.  The version in
# `apps/desktop/src-tauri/tauri.conf.json` and `Cargo.toml` must
# match the tag — `tauri-action` reads them at build time and bakes
# them into Info.plist / .nsh / .desktop.

name: Desktop release

on:
  # Tag-only release strategy.  No branch triggers — pushing
  # commits to main, even when they touch apps/desktop/ or this
  # workflow file, never fires a build.  Two reasons:
  #
  #   1. Branch builds were producing duplicate runs alongside
  #      every tag-push: the same commit produces a "sanity build"
  #      from the branch trigger and a real release build from the
  #      tag trigger.  The sanity build never shipped anywhere
  #      (publish job is gated on tag refs), so it was pure CI
  #      waste — 15+ min of compute, three platform runners, every
  #      commit.
  #
  #   2. `paths:` filtering had subtle interactions with tag
  #      pushes that we kept getting wrong (paths is computed off
  #      the diff against the parent commit; tag pushes against
  #      commits whose parent already touched the relevant files
  #      would skip the tag build entirely).  Dropping the filter
  #      side-steps the whole class of issues.
  #
  # If the bundled SPA changes need to be tested in a desktop
  # context without cutting a real release, run the workflow
  # manually via the workflow_dispatch trigger (gh workflow run
  # "Desktop release" --ref <commit-or-branch>).  Manual dispatch
  # produces bundles as workflow artifacts but skips the publish
  # step — same as the old branch-push behaviour, but on demand.
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

# One release in flight at a time per ref — cancel an in-progress run
# if a newer tag arrives, prevents racing uploads against the same
# release id.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Serialize platform builds so they don't race each other on the
      # updater-manifest merge.  tauri-action with `includeUpdaterJson:
      # true` has every platform job read the existing latest.json off
      # the draft release, splice in its own entry, then DELETE the old
      # asset and upload the new one.  When two platform jobs run in
      # parallel and both reach the delete-then-upload step at roughly
      # the same time, the second one's "delete" call hits a 404
      # because the first one already replaced the asset — surfaces as
      # "Not Found - https://docs.github.com/rest/releases/assets#delete-a-release-asset".
      # Windows lost the race on every release we tried (slowest of the
      # three so it always finished last and always hit the stale
      # asset id).  max-parallel: 1 makes platform builds run one
      # after another; total wall-clock goes up by ~2x but the
      # deterministic failure goes away.
      max-parallel: 1
      matrix:
        include:
          # Apple Silicon only — explicitly opted out of Intel.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            display: macOS-arm64
          - platform: ubuntu-22.04
            args: ""
            display: linux-x64
          - platform: windows-latest
            args: ""
            display: windows-x64
    runs-on: ${{ matrix.platform }}
    name: build (${{ matrix.display }})

    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      # Mac-only guard: refuse to build unless ALL four notarization
      # prerequisites are populated.  We deliberately don't ship
      # unnotarized macOS builds — first-launch Gatekeeper warnings on
      # an "officially-released" binary are an unacceptable user-
      # experience regression.  If any secret is missing the job fails
      # here with a clear message rather than silently producing a
      # signed-but-not-notarized artifact downstream.  Linux + Windows
      # are unaffected by Apple secrets and ignore this step.
      - name: Verify Apple notarization prerequisites
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:     ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID:                   ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:             ${{ secrets.APPLE_PASSWORD }}
        run: |
          missing=()
          [ -z "$APPLE_CERTIFICATE" ]          && missing+=("APPLE_CERTIFICATE")
          [ -z "$APPLE_CERTIFICATE_PASSWORD" ] && missing+=("APPLE_CERTIFICATE_PASSWORD")
          [ -z "$APPLE_SIGNING_IDENTITY" ]     && missing+=("APPLE_SIGNING_IDENTITY")
          [ -z "$APPLE_TEAM_ID" ]              && missing+=("APPLE_TEAM_ID")
          [ -z "$APPLE_ID" ]                   && missing+=("APPLE_ID")
          [ -z "$APPLE_PASSWORD" ]             && missing+=("APPLE_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Refusing to build: required Apple secrets are missing: ${missing[*]}"
            echo "Set these via gh secret set on GnosysLabs/koven-chat to unblock Mac builds."
            echo "See .agents/skills/koven-release for the full setup walkthrough."
            exit 1
          fi
          echo "All six Apple notarization prerequisites are populated."

      - name: Install JS deps (root + apps/desktop)
        run: |
          bun install
          bun install --cwd apps/desktop

      - name: Build web client
        run: bun run --cwd client build

      # `tauri-action` runs `tauri build`, signs each updater artifact
      # with TAURI_SIGNING_PRIVATE_KEY, uploads the bundles + .sig
      # files as release assets to the draft release named below.
      # `tagName`/`releaseName` are evaluated only on tag pushes;
      # branch / dispatch runs skip the upload step entirely.
      - uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action calls the GitHub REST API to create the
          # draft release + upload assets; without GITHUB_TOKEN in
          # env it produces all bundles correctly and then fails
          # at the upload step with "GITHUB_TOKEN is required".
          # `permissions: contents: write` at the workflow level
          # gives the auto-issued GITHUB_TOKEN write access; the
          # env injection is what hands it to the action.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing.  Private key + (empty) password
          # come from repo secrets.  pubkey is committed in
          # tauri.conf.json — that's correct, minisign pubkeys are
          # public.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization.  These are gated on
          # APPLE_CERTIFICATE being set: passing only the *identity*
          # (without the .p12 cert bytes) makes Tauri's bundler attempt
          # `security import` against an empty keychain entry and fail
          # the whole build, so until the .p12 is wired up we ship
          # unsigned Mac builds (Gatekeeper warning on first launch,
          # right-click → Open works).  Set APPLE_CERTIFICATE etc. per
          # the koven-release skill to flip every future build to
          # signed + notarized.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_CERTIFICATE && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_CERTIFICATE && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: "Koven Desktop ${{ github.ref_name }}"
          releaseBody: |
            **macOS:** download the `.app.tar.gz`, expand it, drag Koven into Applications.  First launch right-click → Open if you see a Gatekeeper warning.
            **Windows:** download the `.exe` setup, run it.  First launch may trip SmartScreen — click "More info → Run anyway".
            **Linux:** download the `.AppImage`, `chmod +x`, run.  Or use the `.deb`.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Push the bundled artifacts to the workflow run as a workflow
      # artifact too, so non-tag runs (every push to main, every
      # workflow_dispatch) produce downloadable installers without
      # having to cut a `desktop-v*` tag first.  Tag runs ALSO get
      # this in addition to the GitHub Release upload tauri-action
      # already performs — belt and suspenders, both surfaces stay
      # populated and you can grab a build from either place.
      #
      # Path globs cover every bundler output Tauri 2 emits; non-
      # matching globs are silently skipped on each platform (e.g.
      # macOS won't find `nsis/`, Windows won't find `appimage/`).
      # if-no-files-found: warn so a partial-bundle config change
      # doesn't fail the whole job.
      - name: Upload bundle to workflow artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: koven-desktop-${{ matrix.display }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage.sig
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14

  publish:
    # Only run on tag pushes — branch / dispatch builds stay as draft
    # artifacts.  Depends on every matrix job so the release exists
    # with all platform binaries before we flip it public.
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote draft → published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `--latest=true` is critical: the in-app auto-updater
          # polls /releases/latest/download/latest.json, which
          # GitHub only redirects to a release marked "Latest".
          # Without this flag the release publishes but the
          # updater URL 404s forever — every shipped binary then
          # quietly stops auto-updating.
          gh release edit "${{ github.ref_name }}" \
            --draft=false \
            --latest=true \
            -R ${{ github.repository }}

<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!--
			`viewport-fit=cover` extends the SPA's background under the
			iOS notch / Dynamic Island and under the home-indicator /
			Android system bars; without it, those regions render in
			the WebView's default white while the dark canvas stops at
			the safe-area edges.  Components that touch the screen edge
			are responsible for adding `env(safe-area-inset-*)` padding
			so interactive UI doesn't end up under a system overlay.

			`maximum-scale=1, user-scalable=no` mirrors what every
			native chat app does — pinch-to-zoom inside a chat view
			behaves badly (selects text, zooms past the nav, double-
			triggers gestures), and the platform UI is already sized
			for accessibility.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<title>Koven</title>
		<link rel="icon" type="image/png" href="/favicon.png" />
		<!-- "Add to Home Screen" support.  apple-touch-icon is what iOS
		     Safari uses for the home-screen icon; manifest.webmanifest +
		     theme-color cover Android Chrome / installable PWA.  Both
		     point at /appicon.png — a 1024×1024 PNG sized + safe-area-
		     padded for Apple's rounded-square crop. -->
		<link rel="apple-touch-icon" href="/appicon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Koven" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<!-- `theme-color` would paint iOS / Android system bars in PWA
		     standalone mode, but iOS 26.x ignores it entirely for the
		     home-indicator safe-area zone (multiple WebKit bugs filed,
		     none fixed as of 26.4).  Kept dark to match the rest of the
		     app's chrome rather than random pink that reads as broken. -->
		<meta name="theme-color" content="#0a0a0c" />
		<style>
			/* Lock html/body bg to the SPA's dark colour from the
			 * very first frame — without this the WKWebView's
			 * default white shows through during the brief gap
			 * between window-creation and first paint.  The macOS
			 * desktop builds keep the main window HIDDEN during
			 * that gap (a separate splash window with the favicon
			 * floats over the desktop instead — see lib.rs and
			 * splash.html), but Linux / Windows / browsers see
			 * the main window directly so dark-bg-from-frame-zero
			 * still matters.
			 */
			html, body { margin: 0; background: #0a0a0a; }
		</style>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&display=swap" />
		<script>
			// Set the theme attributes before React mounts so we don't
			// flash the wrong palette for one frame.  Mirrors applyTheme
			// in state/settings.ts — stored choice wins; otherwise honor
			// prefers-color-scheme.
			(function () {
				var DARK_THEMES = ["midnight", "plum", "forest", "ember", "aurora", "cosmos", "sunset", "neon"];
				try {
					var raw = localStorage.getItem("koven:settings");
					var theme = null;
					if (raw) { try { theme = (JSON.parse(raw) || {}).theme || null; } catch (e) {} }
					if (!theme) {
						theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
							? "daylight" : "midnight";
					}
					document.documentElement.setAttribute("data-theme", theme);
					if (DARK_THEMES.indexOf(theme) !== -1) document.documentElement.classList.add("dark");
				} catch (e) {
					document.documentElement.setAttribute("data-theme", "midnight");
					document.documentElement.classList.add("dark");
				}
			})();
		</script>
	</head>
	<body class="antialiased">
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>

[package]
name = "koven-desktop"
version = "0.19.1"
description = "Koven desktop shell — Tauri WebView wrapping client.koven.chat with native window chrome, OS-routed external links, and a minisign-signed in-app updater."
authors = ["Gnosys Labs"]
edition = "2021"
rust-version = "1.77"
# Single binary entry — `main.rs` is a thin wrapper around `lib::run()`
# so iOS / Android targets can share the same logic later.
default-run = "koven-desktop"

[lib]
name = "koven_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` enables Tauri's runtime PNG decoder.  Without it, the
# Linux build can't load PNG icons for the dock / taskbar, so even
# a properly-bundled .AppImage with icons in the right places ends
# up showing the generic placeholder.  Mirrors iris-linux; the cost
# is a few KB on the release binary.
tauri = { version = "2", features = ["image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
# Native save-as dialog for the save_download command.  Without this,
# downloads landed silently in ~/Downloads/ — the user wants to pick
# a location every time, the way browsers' "Save link as…" works.
tauri-plugin-dialog = "2"
# Embedded HTTP server that serves the bundled SPA from
# http://localhost:<port>/ instead of Tauri's default custom-protocol
# scheme (tauri://localhost on macOS/Linux, https://tauri.localhost
# on Windows).
#
# Why this matters: third-party embeds (YouTube, Twitter/X, Spotify,
# Loom, etc.) refuse to render in custom-protocol parents — their
# postMessage origin checks treat anything that isn't http(s) as a
# hostile parent and refuse to initialise the player.  YouTube
# specifically throws error 153 ("Video player configuration error")
# from the tauri:// origin.  http://localhost is a "potentially
# trustworthy" origin per the Secure Contexts spec, so embeds treat
# it the same as a real https site and just work.
tauri-plugin-localhost = "2"
# Random port pinning helper — the localhost plugin needs a port
# that's free at app start; portpicker grabs one without us having to
# hardcode (which would clash on machines already using the port).
portpicker = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
url = "2"

# macOS-only: direct Cocoa bindings to set the contentView's layer
# corner radius + masksToBounds.  This is the actually-working pattern
# for rounded corners on a Tauri 2 macOS window — `transparent(true)`
# is documented as breaking corner clipping (Tauri issue #14165), and
# window-vibrancy 0.6 has no corner-radius API.  Setting layer
# properties directly via `[contentView.layer setCornerRadius]` +
# `[setMasksToBounds: YES]` masks the WKWebView surface itself so
# the rounded shape is what actually paints — no transparency
# needed, no black square peeking out.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"

# Smaller release binary — strip symbols, opt for size.  Tauri bundles
# webview2 / webkit on the host so the binary itself is dominated by
# our own code; aggressive opt + strip shaves a few MB.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
